[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hx-harness"
version = "0.2.0"
description = "把 Agent 开发环境（配置 + 上下文）打包、版本化、迁移的工具"
requires-python = ">=3.9"
dependencies = []
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
hx = "hx.cli:main"

[project.entry-points."hx.adapters"]
claude-code = "hx.adapters.claude_code:ClaudeCodeAdapter"

[tool.setuptools.packages.find]
where = ["src"]
