[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hx-harness"
version = "0.5.0"
description = "把 Agent 开发环境（配置 + 上下文）打包、版本化、迁移的工具"
requires-python = ">=3.9"
dependencies = []
readme = "README.md"
license = { text = "MIT" }
keywords = ["agent", "claude-code", "codex", "harness", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/Source123123/hx"
Documentation = "https://github.com/Source123123/hx/tree/main/docs"
Changelog = "https://github.com/Source123123/hx/blob/main/CHANGELOG.md"
Issues = "https://github.com/Source123123/hx/issues"

[project.scripts]
hx = "hx.cli:main"

[project.entry-points."hx.adapters"]
claude-code = "hx.adapters.claude_code:ClaudeCodeAdapter"
codex = "hx.adapters.codex:CodexAdapter"

[tool.setuptools.packages.find]
where = ["src"]
