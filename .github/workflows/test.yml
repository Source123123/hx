name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # GitHub 的新版 Ubuntu 镜像不再提供 Python 3.9，改在 22.04 上测
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -W error::DeprecationWarning -m unittest discover -s tests -v
      - name: Launcher (macOS / Linux / Git Bash)
        shell: bash
        run: |
          bin/hx --version
          mkdir -p "$RUNNER_TEMP/demo" "$RUNNER_TEMP/home/.claude"
          cd "$RUNNER_TEMP/demo"
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          echo "# rules" > CLAUDE.md
          git add -A
          git commit -qm init
          HX_HOME="$RUNNER_TEMP/home" "$GITHUB_WORKSPACE/bin/hx" save
          HX_HOME="$RUNNER_TEMP/home" "$GITHUB_WORKSPACE/bin/hx" log
      - name: Launcher (Windows command prompt)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          bin\hx.cmd --version
          cd /d "%RUNNER_TEMP%\demo"
          set "HX_HOME=%RUNNER_TEMP%\home"
          "%GITHUB_WORKSPACE%\bin\hx.cmd" doctor
